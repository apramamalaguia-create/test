<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Borloloy! 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 400% 400%;
    animation: gradient 10s ease infinite;
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
    text-align: center;
  }
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: rgba(255, 255, 255, 0.95);
    padding: 50px 40px;
    border-radius: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 600px;
    animation: pop 1s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  h1 {
    font-size: 2.5em;
    color: #e91e63;
    margin-bottom: 20px;
    animation: bounce 2s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  p {
    font-size: 1.2em;
    color: #555;
    line-height: 1.8;
    margin-bottom: 15px;
  }
  .emoji { font-size: 3em; margin: 20px 0; }
  .from {
    margin-top: 30px;
    font-style: italic;
    color: #a18cd1;
    font-size: 1.1em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎂🎉🎈</div>
    <h1>Happy Birthday, Borloloy!</h1>
    <p>Maligayang kaarawan sa iyo! 🥳</p>
    <p>Nawa'y puno ang araw mo ng saya, tawa, at pagmamahal.</p>
    <p>Maraming salamat sa pagiging mabuting kaibigan. 💖</p>
    <p>Hiling ko sa iyo ang lahat ng magagandang bagay sa mundo!</p>
    <div class="emoji">🎁✨🥰</div>
    <div class="from">— Mula sa kaibigan mong nagmamahal 💌</div>
  </div>
</body>
</html>
